[project]
name = "dextrivia"
version = "0.1.0"
description = "Benchmarked classical vs quantum/quantum-inspired sequencing of Iridium-33 debris removal"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Atiksh Shukla" }]
dependencies = [
    "numpy>=1.26",
    "sgp4>=2.23",
]

[project.optional-dependencies]
# Reserved for later workspaces. Keep heavy/optional backends here, not in
# [project.dependencies], so the core benchmark stays installable everywhere.
quantum = []   # QUBO workspace: dimod, neal, dwave-*, qiskit, ...
physics = []   # physics workspace: poliastro/astropy-style extras, if needed

[project.scripts]
dextrivia = "dextrivia.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dextrivia"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
