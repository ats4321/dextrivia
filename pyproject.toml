[project]
name = "dextrivia"
version = "0.1.0"
description = "Benchmarked classical vs quantum/quantum-inspired sequencing of Iridium-33 debris removal"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Atiksh Shukla" }]
dependencies = [
    "numpy>=1.26",
    "sgp4>=2.23",
]

[project.optional-dependencies]
# Reserved for later workspaces. Keep heavy/optional backends here, not in
# [project.dependencies], so the core benchmark stays installable everywhere.
# dwave-samplers supersedes dwave-neal (last released 2022); it ships the
# SimulatedAnnealingSampler that neal used to provide.
# qiskit-optimization is deliberately absent: it is barely maintained and pulls
# in qiskit-algorithms, and dextrivia builds its own Ising operator anyway.
quantum = [
    "dimod>=0.12.17",
    "dwave-samplers>=1.4",
    "qiskit>=2.0",
    "scipy>=1.11",
    "ortools>=9.10",
]
# physics workspace: the plane-aware cost models need nothing beyond numpy +
# sgp4; matplotlib is here only for scripts/plot_cloud.py.
physics = ["matplotlib>=3.8"]

[project.scripts]
dextrivia = "dextrivia.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dextrivia"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
